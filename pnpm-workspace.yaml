packages:
  - .

# Pin exact versions when adding dependencies.
saveExact: true

# Only install versions published at least 7 days ago (minutes); limits exposure to compromised releases.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

skills:
  dirs:
    - .agents/skills
permissions:
  "@tanstack/ai":
    skills: true
  "@tanstack/markdown":
    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
